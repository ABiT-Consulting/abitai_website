name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cpanel-deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          set -euo pipefail
          for v in CPANEL_HOST CPANEL_USER CPANEL_TOKEN CPANEL_REPO_ROOT; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $v"
              exit 1
            fi
          done

      - name: Trigger and monitor cPanel deployment
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_BRANCH: ${{ secrets.CPANEL_BRANCH }}
          CPANEL_INSECURE: ${{ secrets.CPANEL_INSECURE }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          branch="${CPANEL_BRANCH:-}"
          if [ -z "$branch" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
              branch="${GITHUB_REF_NAME}"
            else
              branch="main"
            fi
          fi

          port="${CPANEL_PORT:-2083}"
          base_url="https://${CPANEL_HOST}:${port}/execute"

          curl_flags=(-sS --show-error)
          if [ "${CPANEL_INSECURE:-}" = "true" ]; then
            curl_flags+=(-k)
          fi

          auth_header="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          accept_header="Accept: application/json"

          http_get() {
            local endpoint="$1"
            shift

            local resp body code
            resp="$(curl "${curl_flags[@]}" -H "$auth_header" -H "$accept_header" --get "${base_url}/${endpoint}" "$@" -w $'\n%{http_code}')"
            code="${resp##*$'\n'}"
            body="${resp%$'\n'*}"

            if [ -z "$code" ] || [ "$code" = "$body" ]; then
              echo "::error::Failed to parse HTTP status for ${endpoint}"
              echo "$resp"
              return 1
            fi

            if [ "$code" -ge 400 ]; then
              echo "::error::HTTP ${code} calling ${endpoint}"
              echo "$body"
              return 1
            fi

            if ! echo "$body" | jq -e . >/dev/null 2>&1; then
              echo "::error::Non-JSON response from ${endpoint}"
              echo "$body"
              return 1
            fi

            echo "$body"
          }

          unwrap() {
            jq -c 'if (type=="object") and has("result") then .result else . end'
          }

          require_ok() {
            local endpoint="$1"
            shift

            local json norm ok
            json="$(http_get "$endpoint" "$@")"
            norm="$(echo "$json" | unwrap)"
            ok="$(echo "$norm" | jq -r '((.status // .metadata.result // 0) == 1)')"

            if [ "$ok" != "true" ]; then
              echo "::error::cPanel API call reported failure: ${endpoint}"
              echo "$json" | jq -c .
              return 1
            fi

            echo "$json"
          }

          echo "Deploy branch: ${branch}"
          echo "Repo root: ${CPANEL_REPO_ROOT}"
          echo "cPanel endpoint: ${CPANEL_HOST}:${port}"

          echo "Calling VersionControl/update (best-effort)..."
          set +e
          update_json="$(http_get "VersionControl/update" \
            --data-urlencode "repository_root=${CPANEL_REPO_ROOT}" \
            --data-urlencode "branch=${branch}")"
          update_rc=$?
          set -e

          if [ $update_rc -ne 0 ]; then
            echo "VersionControl/update failed or is blocked; continuing."
          else
            update_norm="$(echo "$update_json" | unwrap)"
            update_ok="$(echo "$update_norm" | jq -r '((.status // .metadata.result // 0) == 1)')"
            if [ "$update_ok" != "true" ]; then
              echo "VersionControl/update returned non-success; continuing."
              echo "$update_json" | jq -c .
            else
              echo "VersionControl/update OK."
            fi
          fi

          echo "Starting VersionControlDeployment/create..."
          create_json="$(require_ok "VersionControlDeployment/create" \
            --data-urlencode "repository_root=${CPANEL_REPO_ROOT}")"

          deploy_id="$(echo "$create_json" | jq -r '(.result? // .) | (.data.deploy_id // empty) | tostring')"
          log_path="$(echo "$create_json" | jq -r '(.result? // .) | (.data.log_path // empty) | tostring')"

          if [ -z "$deploy_id" ]; then
            echo "::error::Missing deploy_id in create response"
            echo "$create_json" | jq -c .
            exit 1
          fi

          echo "deploy_id=${deploy_id}"
          if [ -n "$log_path" ]; then
            echo "log_path=${log_path}"
          fi

          max_attempts=120
          sleep_seconds=5

          for attempt in $(seq 1 "$max_attempts"); do
            retrieve_json="$(require_ok "VersionControlDeployment/retrieve")"

            entry="$(echo "$retrieve_json" | jq -c --arg id "$deploy_id" '(.result? // .) | .data[]? | select((.deploy_id | tostring) == $id) | .')"
            if [ -z "$entry" ] || [ "$entry" = "null" ]; then
              echo "Waiting for deployment to appear (${attempt}/${max_attempts})..."
              sleep "$sleep_seconds"
              continue
            fi

            succeeded="$(echo "$entry" | jq -r '.timestamps.succeeded // empty')"
            failed="$(echo "$entry" | jq -r '.timestamps.failed // empty')"
            canceled="$(echo "$entry" | jq -r '.timestamps.canceled // empty')"
            active="$(echo "$entry" | jq -r '.timestamps.active // empty')"
            queued="$(echo "$entry" | jq -r '.timestamps.queued // empty')"

            if [ -n "$succeeded" ]; then
              echo "Deployment succeeded."
              exit 0
            fi

            if [ -n "$failed" ] || [ -n "$canceled" ]; then
              echo "::error::Deployment failed."
              echo "$entry" | jq -c .

              if [ -n "$log_path" ]; then
                log_dir="${log_path%/*}"
                log_file="${log_path##*/}"

                echo "Fetching deploy log via Fileman/get_file_content..."
                set +e
                log_json="$(require_ok "Fileman/get_file_content" \
                  --data-urlencode "dir=${log_dir}" \
                  --data-urlencode "file=${log_file}" \
                  --data-urlencode "to_charset=utf-8" \
                  --data-urlencode "update_html_document_encoding=0")"
                log_rc=$?
                set -e

                if [ $log_rc -ne 0 ]; then
                  echo "Failed to fetch deploy log."
                else
                  content="$(echo "$log_json" | jq -r '(.result? // .) | .data.content // empty')"
                  echo "----- cPanel deploy log (${log_file}) -----"
                  echo "$content"
                  echo "----- end deploy log -----"
                fi
              fi

              exit 1
            fi

            state="in_progress"
            if [ -n "$active" ]; then state="active"; fi
            if [ -n "$queued" ]; then state="queued"; fi
            echo "Deployment ${state} (${attempt}/${max_attempts})..."
            sleep "$sleep_seconds"
          done

          echo "::error::Timed out waiting for cPanel deployment to finish."
          exit 1
